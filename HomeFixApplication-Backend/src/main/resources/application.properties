# 1. Database Connection Settings
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/homefix_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Prudhvi@2003}
# Explicitly set the driver for the cloud environment
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. CORS - Allows your local React now, but we will override this in Render settings
app.frontend.url=${FRONTEND_URL:http://localhost:5173} 

# 4. Logging & Debugging
# Turn these to 'false' if you want cleaner logs on Render, but 'true' is fine for now
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
# Changed to INFO for production to avoid massive log files, but DEBUG is okay for today
logging.level.com.example.fullstack.HomeFixApplication=INFO

# 5. Cloudinary setup
homefix.cloudinary.name=${HOMEFIX_CLOUDINARY_NAME}
homefix.cloudinary.key=${HOMEFIX_CLOUDINARY_KEY}
homefix.cloudinary.secret=${HOMEFIX_CLOUDINARY_SECRET}